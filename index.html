<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Teacher Licensure Study Console</title><link rel="stylesheet" href="styles.css"><script defer src="data.js"></script><script defer src="app.js"></script></head>
<body><header><div class="header-inner"><small>TEACHER PREPARATION · KNOWLEDGE BANK</small><h1>Teacher Licensure Study Console</h1><p>Learn the content. Recall it. Practice it. Know it.</p></div></header>
<main><section id="home"><h2>Choose your pathway</h2><div class="row pathway"><button data-path="eled">Elementary Education</button><button data-path="sped">Special Education</button><button data-path="all">All exam areas</button></div>
<div id="setup" hidden><h2>Customize your session</h2><fieldset id="subjects"><legend>Exam areas</legend></fieldset><label for="topic">Topic filter</label><select id="topic"><option value="all">All topics</option></select><label for="mode">Study mode</label><select id="mode"><option value="learn">Learn · mini-lessons</option><option value="recall">Recall · self-check prompts</option><option value="practice">Practice · immediate explanations</option><option value="test">Test · answers at the end</option></select><label for="count">Number of lessons or questions</label><select id="count"><option>5</option><option selected>10</option><option>20</option><option>30</option><option>50</option><option value="all">All available</option></select><p id="availability" class="muted"></p><button class="primary" id="start">Start session</button></div></section><section id="session" hidden aria-live="polite"></section></main>
<footer>Independent study resource · No accounts or tracking · Original practice questions · Not affiliated with ETS</footer></body></html>
